name: Playwright Tests CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pwd123
          POSTGRES_DB: zombieplus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BASE_API: http://localhost:3333
      BASE_URL: http://localhost:3000
      API_URL: http://localhost:3333
      APP_NAME: zombieplus-api
      APP_URL: http://localhost
      FRONT_URL: http://localhost:3000
      NODE_ENV: development
      PORT: 3333
      DB_DIALECT: postgres
      DB_HOST: localhost
      DB_NAME: zombieplus
      DB_DATABASE: zombieplus
      DB_USER: postgres
      DB_PASS: pwd123
      DB_PASSWORD: pwd123
      DB_PORT: 5432
      PGSSLMODE: disable
      TOKEN: ${{ secrets.TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies for API
        run: npm install
        working-directory: apps/zombieplus/api

      - name: Install Dependencies for Web
        run: npm install
        working-directory: apps/zombieplus/web

      - name: Install Dependencies for Playwright
        run: npm install
        working-directory: projects/zombieplus

      - name: Run Database Migrations
        run: npx sequelize db:migrate
        working-directory: apps/zombieplus/api

      - name: Run Database Seeds
        run: npx sequelize db:seed:all
        working-directory: apps/zombieplus/api

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps
        working-directory: projects/zombieplus

      - name: Run Playwright tests
        run: |
          print_logs() {
            echo "::group::API log"
            cat "$RUNNER_TEMP/api.log" || true
            echo "::endgroup::"
            echo "::group::Web log"
            cat "$RUNNER_TEMP/web.log" || true
            echo "::endgroup::"
          }

          cleanup() {
            kill "$api_pid" "$web_pid" 2>/dev/null || true
          }

          npm --prefix apps/zombieplus/api run dev > "$RUNNER_TEMP/api.log" 2>&1 &
          api_pid=$!
          npm --prefix apps/zombieplus/web run dev > "$RUNNER_TEMP/web.log" 2>&1 &
          web_pid=$!
          trap cleanup EXIT

          for url in http://localhost:3333 http://localhost:3000; do
            echo "Waiting for $url"

            for attempt in {1..60}; do
              if curl --silent --fail "$url" > /dev/null; then
                echo "$url is ready"
                break
              fi

              if [ "$attempt" -eq 60 ]; then
                echo "$url did not become ready"
                print_logs
                exit 1
              fi

              sleep 2
            done
          done

          (
            cd projects/zombieplus
            npx playwright test
          ) || {
            print_logs
            exit 1
          }

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: projects/zombieplus/playwright-report/
          retention-days: 7
