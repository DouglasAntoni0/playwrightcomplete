name: Playwright Tests CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pwd123
          POSTGRES_DB: zombieplus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BASE_API: http://localhost:3333
      BASE_URL: http://localhost:3000
      API_URL: http://localhost:3333
      APP_NAME: zombieplus-api
      APP_URL: http://localhost
      FRONT_URL: http://localhost:3000
      NODE_ENV: development
      PORT: 3333
      DB_DIALECT: postgres
      DB_HOST: localhost
      DB_NAME: zombieplus
      DB_DATABASE: zombieplus
      DB_USER: postgres
      DB_PASS: pwd123
      DB_PASSWORD: pwd123
      DB_PORT: 5432
      PGSSLMODE: disable
      TOKEN: ${{ secrets.TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies for API
        run: npm install
        working-directory: apps/zombieplus/api

      - name: Install Dependencies for Web
        run: npm install
        working-directory: apps/zombieplus/web

      - name: Install Dependencies for Playwright
        run: npm install
        working-directory: projects/zombieplus

      - name: Run Database Migrations
        run: npx sequelize db:migrate
        working-directory: apps/zombieplus/api

      - name: Run Database Seeds
        run: npx sequelize db:seed:all
        working-directory: apps/zombieplus/api

      - name: Start API
        run: npm run dev &
        working-directory: apps/zombieplus/api

      - name: Start Web
        run: npm run dev &
        working-directory: apps/zombieplus/web

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps
        working-directory: projects/zombieplus

      - name: Wait for servers to be ready
        run: npx wait-on http://localhost:3333 http://localhost:3000
        timeout-minutes: 5

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: projects/zombieplus

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: projects/zombieplus/playwright-report/
          retention-days: 7
